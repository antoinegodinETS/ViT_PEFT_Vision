# SYS843 protocol for processed VTAB-1k (V-PETL Hugging Face zip, NOAH-style splits).
# Copy of experiment/config/default_vtab_processed.yml (Mai et al.'s default) with these
# SYS843 choices made explicit:
#   - backbone ViT-B/16 supervised IN-21k (pretrained_weights), AdamW, cosine schedule
#     (lr_min, warmup_lr_init), 100 epochs with 10 warmup epochs, batch 64: Mai's defaults;
#   - normalized: false (resize to 224 and scale to [0, 1], no ImageNet mean/std);
#   - eval_freq (200) > epoch (100): the validation set is evaluated once, after the last
#     epoch, and final_acc_hp: true selects the grid point with the best final-epoch
#     validation accuracy (column val_top1 of tune_summary.csv);
#   - random_seed is the tuning seed, set again before every grid point;
#     final_seeds are the seeds of the final runs on train800val200 (test once, last epoch).
# lr and wd come from lr_wd_peft.yml / lr_wd_full.yml; the method from method/*.yml.
experiment_name: sys843_vtab
pretrained_weights: vit_base_patch16_224_in21k
drop_path_rate: 0.1
model: vit
optimizer: adamw
epoch: 100
warmup_epoch: 10
lr_min: 1.0e-5
warmup_lr_init: 1.0e-6
batch_size: 64
test_batch_size: 512
momentum: 0.9
crop_size: 224
final_run: False
ft_attn_module: null
ft_attn_mode: parallel
ft_attn_ln: before
ft_mlp_module: null
ft_mlp_mode: parallel
ft_mlp_ln: before
adapter_bottleneck: 64
adapter_init: lora_kaiming
adapter_scaler: 0.1
convpass_bottleneck: 8
convpass_xavier_init: False
convpass_init: lora_xavier
convpass_scaler: 10
vpt_mode: null
vpt_num: 10
vpt_layer: null
vpt_dropout: 0.1
ssf: False
lora_bottleneck: 0
fact_dim: 8
fact_type: null
fact_scaler: 1.0
repadapter_bottleneck: 8
repadapter_init: lora_xavier
repadapter_scaler: 1
repadapter_group: 2
bitfit: False
vqt_num: 0
vqt_dropout: 0.1
mlp_index: null
mlp_type: full
attention_index: null
attention_type: full
ln: False
difffit: False
full: False
block_index: null
gpu_num: 1
debug: False
random_seed: 42
eval_freq: 200
data_path: data_folder/vtab-1k  # usually overridden with --data_path
normalized: False
early_patience: 100
store_ckp: False
merge_factor: 1
final_acc_hp: True
final_seeds: [0, 1, 2]