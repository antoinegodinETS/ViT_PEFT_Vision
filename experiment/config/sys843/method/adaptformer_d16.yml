# AdaptFormer at the ~0.3M budget: bottleneck (middle dimension) 16 in every block's MLP,
# 304,320 trainable parameters without the head. The scale s is fixed at 0.1, the AdaptFormer
# paper's default (Chen et al., arXiv 2205.13535, Sec. 4.5, Table 3c), so this config has the
# same 20-point lr x wd grid as the other PEFT configs. Module settings as in Mai's
# method/adaptformer.yml.
method_name: adaptformer_d16
ft_mlp_module: adapter
ft_mlp_mode: parallel
ft_mlp_ln: before
adapter_init: lora_kaiming
adapter_bottleneck: 16
adapter_scaler: 0.1
